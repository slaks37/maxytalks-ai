case 'gemini':return `${heading('16 / ANOTHER ECOSYSTEM','GEMINI +<br><span class="accent">GOOGLE WORKSPACE.</span>','Alur serupa, alat berbeda. Cocok untuk dokumen, materi, dan komunikasi yang berada di layanan Google.')}<div class="three below"><div class="card"><div class="icon">①</div><h3>Find</h3><p>Periksa Connected Apps, lalu minta akses ke materi Google Drive yang tersedia.</p></div><div class="card"><div class="icon">②</div><h3>Synthesize</h3><p>Minta learning plan dan daftar konsep penting berdasarkan dokumen yang ditemukan.</p></div><div class="card"><div class="icon">③</div><h3>Verify</h3><p>Buka sumber asli, cek akurasi, kemudian ubah hasil sesuai kebutuhan.</p></div></div><div class="callout" style="margin-top:23px"><b>Trainer tip:</b> Nama menu dan dukungan aplikasi dapat berbeda sesuai akun, paket, wilayah, serta kebijakan administrator. Selalu siapkan contoh file lokal.</div>`;
case 'challenge':{const ch=[['STUDENT','AI Study Partner','Syllabus → rencana belajar + 5 pertanyaan kuis','📚'],['FRESH GRAD','AI Career Assistant','CV + lowongan → gap analysis + interview brief','🚀'],['PROFESSIONAL','AI Work Assistant','Dokumen proyek → prioritas + action items','💼']];const v=ch[S.challenge];const mm=String(Math.floor(S.seconds/60)).padStart(2,'0'),ss=String(S.seconds%60).padStart(2,'0');return `${heading('17 / YOUR TURN — 20 MINUTES','GIVE AI<br><span class="accent">A REAL JOB.</span>','Pilih satu misi, gunakan minimal satu sumber nyata yang aman, dan hasilkan sesuatu yang siap ditinjau.')}<div class="three below">${ch.map((x,k)=>`<button data-challenge="${k}" class="d-card ${S.challenge===k?'selected':''}" style="min-height:165px"><span style="font-size:29px">${x[3]}</span><strong>${x[1]}</strong><p>${x[0]}</p></button>`).join('')}</div><div class="two" style="margin-top:18px;align-items:center"><div class="soft"><div class="mini">YOUR MISSION</div><h3 style="margin:9px 0;font-size:20px">${v[1]}</h3><p style="font-size:13px;line-height:1.5;margin:0">${v[2]}</p></div><div class="card" style="display:flex;align-items:center;justify-content:space-between"><div><div class="mini">FOCUS TIMER</div><div style="font-size:44px;font-weight:950;letter-spacing:-2px">${mm}:${ss}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:end"><button class="btn" id="timerBtn">${S.running?'Pause':'Start'}</button><button class="btn secondary" id="timerReset">Reset</button></div></div></div>`}
case 'checklist':{const t=['Saya menentukan pekerjaan yang nyata.','Saya memberi tujuan, konteks, dan format.','Saya memakai minimal satu sumber relevan.','Saya menghasilkan draft yang bisa digunakan.','Saya memeriksa fakta sebelum menyetujui.'];const n=S.checked.filter(Boolean).length;return `${heading('18 / QUICK SELF-CHECK','SHOW THE WORK.<br><span class="accent">NOT JUST THE PROMPT.</span>','Apa yang sudah berhasil kamu lakukan hari ini? Centang berdasarkan praktikmu sendiri.')}<div class="two below" style="grid-template-columns:1.2fr .8fr"><div class="card" style="padding:19px">${t.map((v,k)=>`<label class="checkrow ${S.checked[k]?'done':''}"><input type="checkbox" data-check="${k}" ${S.checked[k]?'checked':''}><span>${v}</span></label>`).join('')}</div><div class="soft" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div class="mini">AI WORK READINESS</div><div class="big-number">${n}<span style="font-size:35px;color:#a9afd3">/5</span></div><div class="progress-track" style="width:80%;margin:14px 0"><div class="progress-fill" style="width:${n*20}%"></div></div><p style="font-size:13px;line-height:1.5">${n===5?'Ready to work with AI. Keep practicing responsibly.':'Terus coba, cek hasil, lalu tingkatkan prosesmu.'}</p></div></div>`}
case 'closing':return `<div class="eyebrow">19 / THE FINAL SHIFT</div><div style="margin:auto 0"><div class="smallcaps" style="font-size:13px;color:#b6abfb;margin-bottom:18px">THE FUTURE OF WORK IS COLLABORATION</div><h1 class="big xl">DON’T JUST<br>USE AI.<br><span class="gradtext">WORK WITH AI.</span></h1><p class="desc" style="max-width:760px;font-size:clamp(19px,1.9vw,29px);line-height:1.38;margin-top:28px">AI doesn’t replace your thinking.<br><b style="color:white">It expands what you can do.</b></p></div><div class="human" style="max-width:730px;background:#ffffff14;border:1px solid #ffffff30"><div style="font-size:25px">↗</div><div><strong>THE QUESTION TO TAKE HOME</strong><br><span>Besok, pekerjaan apa yang akan kamu delegasikan ke AI?</span></div></div><div class="brandline">MAXYTALKS · HUMAN SETS GOALS · AI SUPPORTS WORK · HUMAN OWNS OUTCOMES</div>`;
}}
function render(){const i=S.slide,dat=data[i],stage=document.getElementById('stage');stage.className='stage '+(dat.dark?'dark':i%5===1?'gradient':'');stage.innerHTML=`<section class="slide" aria-label="Slide ${i+1}: ${esc(dat.label)}">${slideHTML(i)}</section><div class="notes-panel ${S.notes?'visible':''}" id="notes"><h3>🎙 Presenter notes — Slide ${i+1}</h3><p>${esc(dat.note)}</p><button class="mini-btn" data-close-notes="1">Close ×</button></div>`;document.getElementById('footerTitle').textContent=dat.section+' / '+dat.label;document.getElementById('counter').textContent=String(i+1).padStart(2,'0')+' / 20';document.getElementById('bar').style.width=((i+1)/data.length*100)+'%';document.getElementById('prev').disabled=i===0;document.getElementById('next').textContent=i===19?'Start again ↻':'Next →';document.querySelectorAll('.navdot').forEach((n,j)=>n.classList.toggle('active',i>=Number(n.dataset.to)&&(j===4||i<Number(document.querySelectorAll('.navdot')[j+1].dataset.to))));bind();}
function go(i){S.slide=Math.max(0,Math.min(i,19));render();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
let generated='';
function collectJob(){const get=k=>document.getElementById(k)?.value?.trim()||'[isi sesuai kebutuhan]';return `Act as an AI work assistant.\n\nJOB: ${get('jobTask')}\nGOAL: ${get('jobGoal')}\nCONTEXT & SOURCES: ${get('jobContext')}\nEXPECTED OUTPUT: ${get('jobOutput')}\nBOUNDARIES: Do not invent data or deadlines. Clearly label assumptions and missing information. Do not perform external actions without my approval.\nREVIEW: Cite available sources, distinguish fact from recommendation, and ask me to verify the draft before final use.`;}
function bind(){document.querySelectorAll('[data-poll]').forEach(b=>b.onclick=()=>{S.poll=Number(b.dataset.poll);render()});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.d=Number(b.dataset.d);render()});document.querySelectorAll('[data-conn]').forEach(b=>b.onclick=()=>{S.connected[Number(b.dataset.conn)]=!S.connected[Number(b.dataset.conn)];render()});document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{S.demoTab=Number(b.dataset.demo);render()});document.querySelectorAll('[data-project]').forEach(b=>b.onchange=()=>{S.project[Number(b.dataset.project)]=b.checked;render()});document.querySelectorAll('[data-challenge]').forEach(b=>b.onclick=()=>{S.challenge=Number(b.dataset.challenge);render()});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{S.checked[Number(b.dataset.check)]=b.checked;render()});document.querySelectorAll('[data-close-notes]').forEach(b=>b.onclick=()=>{S.notes=false;render()});const builder=document.getElementById('buildPrompt');if(builder)builder.onclick=()=>{generated=collectJob();document.getElementById('promptOutput').textContent=generated;toast('Job brief generated')};const copy=document.getElementById('copyPrompt');if(copy)copy.onclick=async()=>{generated=collectJob();try{await navigator.clipboard.writeText(generated);toast('Prompt copied')}catch(e){let ta=document.createElement('textarea');ta.value=generated;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Prompt copied')}};const tb=document.getElementById('timerBtn');if(tb)tb.onclick=()=>{S.running=!S.running;updateTimerButton(); if(S.running&&!S.timer){S.timer=setInterval(()=>{if(S.seconds>0)S.seconds--;else{S.running=false;clearInterval(S.timer);S.timer=null;toast('Time is up!')}const current=document.querySelector('#timerBtn');if(current){const el=current.closest('.card')?.querySelector('.big-number')||current.parentElement?.previousElementSibling?.querySelector('div:nth-child(2)');if(el)el.textContent=String(Math.floor(S.seconds/60)).padStart(2,'0')+':'+String(S.seconds%60).padStart(2,'0');updateTimerButton();}},1000)}if(!S.running&&S.timer){clearInterval(S.timer);S.timer=null}};const reset=document.getElementById('timerReset');if(reset)reset.onclick=()=>{S.running=false;if(S.timer)clearInterval(S.timer);S.timer=null;S.seconds=1200;render()};}
function updateTimerButton(){const x=document.getElementById('timerBtn');if(x)x.textContent=S.running?'Pause':'Start'}
document.getElementById('prev').onclick=()=>go(S.slide-1);document.getElementById('next').onclick=()=>go(S.slide===19?0:S.slide+1);document.querySelectorAll('.navdot').forEach(n=>n.onclick=()=>go(Number(n.dataset.to)));document.getElementById('notesBtn').onclick=()=>{S.notes=!S.notes;render()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(S.slide+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(S.slide-1)}else if(e.key.toLowerCase()==='n'){S.notes=!S.notes;render()}else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(19)}else if(e.key==='Escape'&&S.notes){S.notes=false;render()}});render();
</script>
</body></html>
